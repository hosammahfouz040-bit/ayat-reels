
name: Build Ayat APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract source
        run: |
          unzip -q Ayat-source.zip -d source
          test -f source/ayat-reels/frontend/package.json
          test -f source/ayat-reels/frontend/android/gradlew

      - name: Install and build frontend
        working-directory: source/ayat-reels/frontend
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Sync Android project
        working-directory: source/ayat-reels/frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: source/ayat-reels/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ayat-APK
          path: source/ayat-reels/frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
